<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background: black rounded box -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="#000000" />

  <!-- Capital I mark: stem with clear top/bottom serif caps -->
  <g fill="#ffffff">
    <!-- top serif cap -->
    <rect x="166" y="108" width="180" height="42" rx="12" />
    <!-- vertical stem -->
    <rect x="228" y="108" width="56" height="296" rx="12" />
    <!-- bottom serif cap -->
    <rect x="166" y="362" width="180" height="42" rx="12" />
  </g>
</svg>
