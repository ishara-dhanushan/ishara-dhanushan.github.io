name: Build Check

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Check code formatting
        run: npm run format:check

      - name: Check linting
        run: npm run lint

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_ASSET_PREFIX: ${{ secrets.NEXT_PUBLIC_ASSET_PREFIX }}
          NEXT_PUBLIC_IS_EXPORT: ${{ secrets.NEXT_PUBLIC_IS_EXPORT }}
          NEXT_PUBLIC_MEDIUM_FEED_API_URL: ${{ secrets.NEXT_PUBLIC_MEDIUM_FEED_API_URL }}
        run: npm run build

      - name: Format build output
        run: npm run format:out
